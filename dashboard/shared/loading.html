<div
  class="dashboard-skeleton"
  data-dashboard-loading="__LAYOUT__"
  role="status"
  aria-label="Đang tải nội dung học tập"
  aria-busy="true"
>
  <span class="sr-only">Đang tải nội dung học tập</span>
  <div class="dashboard-skeleton__header" aria-hidden="true">
    <span class="dashboard-skeleton__shape dashboard-skeleton__brand"></span>
    <span class="dashboard-skeleton__shape dashboard-skeleton__avatar"></span>
  </div>
  <div class="dashboard-skeleton__sidebar" aria-hidden="true">
    <span class="dashboard-skeleton__shape dashboard-skeleton__nav"></span>
    <span class="dashboard-skeleton__shape dashboard-skeleton__nav"></span>
    <span class="dashboard-skeleton__shape dashboard-skeleton__nav"></span>
    <span class="dashboard-skeleton__shape dashboard-skeleton__nav"></span>
  </div>
  <div class="dashboard-main" aria-hidden="true">
    <div class="dashboard-main__inner">
      <div class="dashboard-skeleton__heading">
        <span
          class="dashboard-skeleton__shape dashboard-skeleton__title"
        ></span>
        <span
          class="dashboard-skeleton__shape dashboard-skeleton__subtitle"
        ></span>
      </div>
      <div class="dashboard-skeleton__shape dashboard-skeleton__hero"></div>
      <div class="dashboard-skeleton__grid">
        <div class="dashboard-skeleton__card">
          <div
            class="dashboard-skeleton__shape dashboard-skeleton__picture"
          ></div>
          <span
            class="dashboard-skeleton__shape dashboard-skeleton__line"
          ></span>
          <span
            class="dashboard-skeleton__shape dashboard-skeleton__line dashboard-skeleton__line--short"
          ></span>
          <span
            class="dashboard-skeleton__shape dashboard-skeleton__progress"
          ></span>
        </div>
        <div class="dashboard-skeleton__card">
          <div
            class="dashboard-skeleton__shape dashboard-skeleton__picture"
          ></div>
          <span
            class="dashboard-skeleton__shape dashboard-skeleton__line"
          ></span>
          <span
            class="dashboard-skeleton__shape dashboard-skeleton__line dashboard-skeleton__line--short"
          ></span>
          <span
            class="dashboard-skeleton__shape dashboard-skeleton__progress"
          ></span>
        </div>
        <div class="dashboard-skeleton__card dashboard-skeleton__summary">
          <span
            class="dashboard-skeleton__shape dashboard-skeleton__line"
          ></span>
          <div class="dashboard-skeleton__shape dashboard-skeleton__ring"></div>
          <span
            class="dashboard-skeleton__shape dashboard-skeleton__line dashboard-skeleton__line--short"
          ></span>
        </div>
      </div>
    </div>
  </div>
</div>
