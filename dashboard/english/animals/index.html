<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Khám phá 10 từ tiếng Anh chủ đề động vật qua hình ảnh, phát âm và trò chơi cùng FutureLearn." />
    <title>Thế giới động vật – Đảo tiếng Anh | FutureLearn</title>
    <link rel="icon" href="../../../favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&family=Roboto:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../../shared/layout.css?v=1.0.4" />
    <link rel="stylesheet" href="./style.css?v=5" />
    <link rel="stylesheet" href="./fullscreen.css?v=2" />
    <link rel="stylesheet" href="./completion.css?v=1" />
  </head>
  <body data-dashboard="english">
    <svg class="icon-definitions" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <symbol id="icon-book" viewBox="0 0 24 24"><path d="M12 5C9 3 6 3 3 4v15c3-1 6-1 9 1m0-15c3-2 6-2 9-1v15c-3-1-6-1-9 1V5Z" /><path d="M6 7h3m-3 4h3m6-4h3m-3 4h3" /></symbol>
        <symbol id="icon-game" viewBox="0 0 24 24"><path d="M7 7h10c2 0 3 2 4 6l1 4c.5 3-2 4-4 2l-3-3H9l-3 3c-2 2-4.5 1-4-2l1-4c1-4 2-6 4-6Z" /><path d="M7 10v5m-2.5-2.5h5M16 11h.1M19 14h.1" /></symbol>
        <symbol id="icon-cup" viewBox="0 0 24 24"><path d="M7 3h10v6a5 5 0 0 1-10 0V3Zm5 11v6m-4 1h8M7 5H3v3a4 4 0 0 0 4 4m10-7h4v3a4 4 0 0 1-4 4" /></symbol>
        <symbol id="icon-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2" /><path d="M8 10V7a4 4 0 0 1 8 0v3m-4 5v2" /></symbol>
        <symbol id="icon-volume" viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3V9Z" /><path d="M16 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14" /></symbol>
        <symbol id="icon-chat" viewBox="0 0 24 24"><path d="M21 11a9 9 0 0 1-9 9H8l-5 2 1-6A9 9 0 1 1 21 11Z" /><path d="M8 11h.1m4 0h.1m4 0h.1" /></symbol>
        <symbol id="icon-arrow" viewBox="0 0 24 24"><path d="M4 12h16m-6-6 6 6-6 6" /></symbol>
        <symbol id="icon-headphones" viewBox="0 0 24 24"><path d="M4 14v-3a8 8 0 0 1 16 0v3" /><rect x="3" y="12" width="5" height="9" rx="2" /><rect x="16" y="12" width="5" height="9" rx="2" /></symbol>
        <symbol id="icon-star" viewBox="0 0 40 40"><path d="m20 3 5.2 10.3 11.4 1.8-8.2 8.1 1.8 11.5L20 29.3 9.8 34.7l1.8-11.5-8.2-8.1 11.4-1.8Z" fill="#ffd43b" stroke="#f4b000" stroke-width="1.5" stroke-linejoin="round" /><circle cx="16" cy="19" r="1.6" fill="#795313" /><circle cx="24" cy="19" r="1.6" fill="#795313" /><path d="M17 24q3 3 6 0" fill="none" stroke="#795313" stroke-width="1.8" stroke-linecap="round" /></symbol>
      </defs>
    </svg>
    <div data-dashboard-header></div>
    <main class="dashboard-main" id="main-content">
      <div class="dashboard-main__inner">
        <div class="animal-layout">
          <div class="lesson-column">
        <nav class="lesson-breadcrumb" aria-label="Đường dẫn"><a href="../">Đảo tiếng Anh</a><span aria-hidden="true"> / </span><span aria-current="page">Động vật</span></nav>
        <h1 class="lesson-title">Thế giới động vật</h1>
        <nav class="lesson-steps" aria-label="Các bước học">
          <button type="button" class="is-active" data-mode="learn" aria-current="step"><svg class="lesson-icon" aria-hidden="true"><use href="#icon-book" /></svg><span>1. Học từ mới</span></button>
          <button type="button" data-mode="practice" disabled><svg class="lesson-icon" aria-hidden="true"><use href="#icon-game" /></svg><span>2. Luyện tập</span><svg class="lock-icon" data-lock aria-label="Chưa mở khóa"><use href="#icon-lock" /></svg></button>
          <button type="button" data-mode="quiz" disabled><svg class="lesson-icon" aria-hidden="true"><use href="#icon-cup" /></svg><span>3. Kiểm tra</span><svg class="lock-icon" data-lock aria-label="Chưa mở khóa"><use href="#icon-lock" /></svg></button>
        </nav>
            <section class="flashcard" aria-label="Thẻ từ vựng">
              <button type="button" class="fullscreen-toggle" data-fullscreen aria-label="Phóng to toàn màn hình" aria-pressed="false" title="Toàn màn hình"><svg viewBox="0 0 24 24" aria-hidden="true"><path class="fullscreen-expand" d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg><span class="fullscreen-exit-label">Thoát</span></button>
              <div data-learning>
                <div class="word-content" aria-live="polite" aria-atomic="true">
                  <img class="animal-illustration" data-animal-image width="360" height="290" alt="" fetchpriority="high" />
                  <div class="word-title">
                    <div class="word-definition"><h2 data-word></h2><p class="translation" data-translation></p></div>
                    <div class="pronunciation"><button type="button" class="speaker" aria-label="Nghe phát âm" data-speak><svg aria-hidden="true"><use href="#icon-volume" /></svg></button></div>
                  </div>
                  <p class="example"><svg aria-hidden="true"><use href="#icon-chat" /></svg><span data-example></span></p>
                </div>
                <div class="word-controls">
                  <button type="button" class="button button--secondary" data-prev><svg class="arrow-back" aria-hidden="true"><use href="#icon-arrow" /></svg>Quay lại</button>
                  <div class="word-dots" role="group" aria-label="Chọn từ vựng" data-word-dots></div>
                  <button type="button" class="button button--primary" data-next><span>Tiếp theo</span><svg aria-hidden="true"><use href="#icon-arrow" /></svg></button>
                </div>
              </div>
              <div class="lesson-completion" data-completion hidden aria-labelledby="completion-title">
                <svg class="completion-star" aria-hidden="true"><use href="#icon-star" /></svg>
                <h2 id="completion-title" tabindex="-1">Chúc mừng bé!</h2>
                <p>Bé đã khám phá đủ 10 từ về động vật.</p>
                <p class="completion-reward">+20 sao cho bài học này</p>
                <p>Luyện nghe và chọn hình để nhớ các bạn động vật lâu hơn nhé!</p>
                <div class="completion-actions">
                  <button type="button" class="button button--primary" data-completion-practice>Luyện tập ngay</button>
                  <button type="button" class="button button--secondary" data-completion-review>Ôn lại 10 từ</button>
                </div>
              </div>
              <div data-exercise hidden>
                <h2 data-question></h2>
                <button type="button" class="button button--secondary" data-exercise-speak><svg aria-hidden="true"><use href="#icon-volume" /></svg>Nghe từ cần chọn</button>
                <div class="answer-grid" data-answers></div><p data-feedback role="status"></p>
                <button type="button" class="button button--primary" data-question-next hidden>Câu tiếp theo</button>
              </div>
            </section>

          </div>
          <aside>
            <section class="topic-summary">
              <h2>Tiến độ chủ đề</h2>
              <div class="animal-ring" role="progressbar" aria-label="Tiến độ học từ" aria-valuemin="0" aria-valuemax="10" aria-valuenow="0"><strong data-ring-count>0/10</strong></div>
              <p class="summary-note" data-summary>Đã học 0 từ</p>
              <p class="reward"><svg aria-hidden="true"><use href="#icon-star" /></svg><span data-reward><strong>+20 sao</strong> khi hoàn thành</span></p>
            </section>
            <section class="next-activities">
              <h2>Sau khi học từ mới</h2>
              <button type="button" class="activity-link" data-activity-mode="practice" disabled><svg class="activity-icon activity-icon--game" aria-hidden="true"><use href="#icon-game" /></svg><span>Nghe và chọn hình</span><svg class="lock-icon" data-lock aria-label="Chưa mở khóa"><use href="#icon-lock" /></svg><span class="activity-chevron" aria-hidden="true">›</span></button>
              <button type="button" class="activity-link" data-activity-mode="practice" disabled><svg class="activity-icon activity-icon--listen" aria-hidden="true"><use href="#icon-headphones" /></svg><span>Luyện nghe từ mới</span><svg class="lock-icon" data-lock aria-label="Chưa mở khóa"><use href="#icon-lock" /></svg><span class="activity-chevron" aria-hidden="true">›</span></button>
              <button type="button" class="activity-link" data-activity-mode="quiz" disabled><svg class="activity-icon activity-icon--cup" aria-hidden="true"><use href="#icon-cup" /></svg><span>Đố vui động vật</span><svg class="lock-icon" data-lock aria-label="Chưa mở khóa"><use href="#icon-lock" /></svg><span class="activity-chevron" aria-hidden="true">›</span></button>
              <button type="button" class="button button--primary practice-button" data-start-practice disabled><svg class="lock-icon" data-lock aria-label="Chưa mở khóa"><use href="#icon-lock" /></svg><span>Luyện tập</span></button>
            </section>
          </aside>
        </div>
        <section class="word-library" aria-labelledby="words-title"><h2 id="words-title">Các từ trong chủ đề</h2><div class="word-carousel"><div id="topic-words" class="word-grid" data-word-grid></div><button type="button" class="word-scroll-next" data-scroll-words aria-label="Xem các từ tiếp theo" aria-controls="topic-words"><svg aria-hidden="true"><use href="#icon-arrow" /></svg></button></div></section>
        <p class="lesson-notice" role="status" data-notice hidden></p>
        <noscript>Vui lòng bật JavaScript để học từ và lưu tiến độ.</noscript>
      </div>
    </main>
    <dialog class="answer-dialog" data-answer-dialog aria-labelledby="answer-dialog-title" aria-describedby="answer-dialog-message">
      <div class="answer-dialog__symbol" data-answer-symbol aria-hidden="true"></div>
      <h2 id="answer-dialog-title" data-answer-title></h2>
      <p id="answer-dialog-message" data-answer-message></p>
      <button type="button" class="button button--primary" data-answer-action>Chọn lại</button>
    </dialog>
    <div data-dashboard-footer></div>
    <script src="./words.js?v=2"></script><script src="./progress.js"></script><script src="../../shared/layout.js?v=1.0.6"></script><script src="./app.js?v=4"></script><script src="./fullscreen.js?v=2"></script>
  </body>
</html>
